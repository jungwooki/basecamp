<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS Player's Passport - 표지</title>

    <!-- 프리텐다드 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- Tailwind CSS & KFA Custom Colors Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kfa: {
                            blue: '#00145A',
                            red: '#E6002D',
                            gold: '#B3995D',
                            black: '#1A1A1A'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.359.0?deps=react@18.2.0"
      }
    }
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html2pdf 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* A4 Print Layout 최적화 */
        .a4-page {
            width: 210mm;
            height: 297mm;
            margin: 0 auto 2rem auto;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
        }

        .cover-page {
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body { background-color: #ffffff; }
            .no-print { display: none !important; }
            .a4-page {
                margin: 0;
                box-shadow: none;
                border: none;
            }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Settings, Printer, Brain, Activity, TrendingUp, ShieldCheck, Flame, 
            CalendarDays, User, Stethoscope, ChevronDown, ChevronUp
        } from 'lucide-react';

        const INITIAL_DATA = {
            profile: {
                name: '이해온',
                birth: '2012-05-20',
                testDate: '2026-03-18',
                doctorName: '이정욱 원장',
                team: '대동초 U-14 유스'
            }
        };

        // --- Page Component ---

        const PageCover = ({ data }) => {
            const { name, birth, testDate, team, doctorName } = data.profile;
            return (
                <div className="a4-page cover-page bg-white relative">
                    {/* Background Graphic Accents */}
                    <div className="absolute top-0 right-0 w-96 h-96 bg-gradient-to-bl from-sky-100 to-transparent rounded-bl-full -z-10 opacity-80"></div>
                    <div className="absolute bottom-0 left-0 w-80 h-80 bg-gradient-to-tr from-rose-50 to-transparent rounded-tr-full -z-10 opacity-80"></div>
                    
                    {/* Header Section */}
                    <div className="pt-24 px-16">
                        <div className="flex items-center gap-3 text-kfa-blue font-black tracking-[0.2em] mb-6">
                            <ShieldCheck size={28} className="text-kfa-red" />
                            MPS REPORT
                        </div>
                        <h1 className="text-[4rem] font-black text-kfa-blue leading-[1.1] mb-8">{name} 님<br/>Player's Passport</h1>
                        <div className="w-32 h-3 bg-kfa-red mb-10 rounded-full"></div>
                        <p className="text-2xl text-slate-600 font-medium break-keep leading-relaxed max-w-2xl">
                            유소년 스포츠 선수의 지속적인 성장을 위한 <br/>
                            <span className="font-bold text-kfa-red">심리, 피지컬, 성장 및 부상 리스크</span> 통합 분석 리포트입니다.
                        </p>
                    </div>

                    {/* MPS Explanation Section */}
                    <div className="px-16 py-16 flex-1 flex flex-col justify-center gap-8">
                        {/* Mental */}
                        <div className="flex gap-6 items-start">
                            <div className="w-14 h-14 flex items-center justify-center rounded-2xl bg-sky-100 text-sky-500 flex-shrink-0 shadow-sm border border-sky-200">
                                <span className="text-2xl font-black">M</span>
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-kfa-blue mb-2 flex items-center gap-2">
                                    <Brain size={20} className="text-sky-500" /> Mental Performance
                                </h3>
                                <p className="text-base text-slate-600 leading-relaxed break-keep">
                                    선수의 경기 긴장 관리, 회복 탄력성, 집중력 등 경기력에 직접적인 영향을 미치는 심리적 요인과 멘탈 역량을 다각도로 분석하여 강력한 멘탈리티 구축을 돕습니다.
                                </p>
                            </div>
                        </div>

                        {/* Physical */}
                        <div className="flex gap-6 items-start">
                            <div className="w-14 h-14 flex items-center justify-center rounded-2xl bg-rose-100 text-kfa-red flex-shrink-0 shadow-sm border border-rose-200">
                                <span className="text-2xl font-black">P</span>
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-kfa-blue mb-2 flex items-center gap-2">
                                    <Flame size={20} className="text-kfa-red" /> Physical & Risk
                                </h3>
                                <p className="text-base text-slate-600 leading-relaxed break-keep">
                                    자율신경계(HRV) 스트레스 분석, 체성분 균형 판독, 주요 관절/건 초음파 검사를 통해 눈에 보이지 않는 누적 피로도와 잠재적 부상 위험을 조기에 진단합니다.
                                </p>
                            </div>
                        </div>

                        {/* Somatic / Growth */}
                        <div className="flex gap-6 items-start">
                            <div className="w-14 h-14 flex items-center justify-center rounded-2xl bg-emerald-100 text-emerald-500 flex-shrink-0 shadow-sm border border-emerald-200">
                                <span className="text-2xl font-black">S</span>
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-kfa-blue mb-2 flex items-center gap-2">
                                    <TrendingUp size={20} className="text-emerald-500" /> Stage of Growth
                                </h3>
                                <p className="text-base text-slate-600 leading-relaxed break-keep">
                                    골연령(뼈 나이) 판독과 체격 데이터를 기반으로 현재의 성장 단계(Biological Maturation)를 파악하고, 최종 신장 예측 및 시기별 맞춤형 훈련 가이드를 제공합니다.
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Footer Info Box */}
                    <div className="bg-slate-50 p-6 mt-auto border-t-4 border-kfa-blue">
                        <div className="grid grid-cols-2 gap-4 items-end">
                            <div>
                                <div className="text-xl font-black text-kfa-blue mb-1">{name} <span className="text-sm font-bold text-slate-600">선수</span></div>
                                <div className="text-sm text-slate-600 font-medium mb-1">{team}</div>
                                <div className="text-xs text-slate-500">생년월일: {birth}</div>
                            </div>
                            <div className="text-right border-l-2 border-slate-200 pl-4">
                                <div className="text-[10px] font-bold text-slate-400 mb-2 tracking-wider flex items-center justify-end gap-1">
                                    <CalendarDays size={12} /> HAEON K-MEDI CLINIC
                                </div>
                                <div className="text-sm font-bold text-kfa-blue mb-1">검사일자: {testDate}</div>
                                <div className="text-sm font-bold text-kfa-blue flex items-center justify-end gap-1">
                                    <Stethoscope size={14} className="text-kfa-red" /> 담당 의료진: {doctorName}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [data, setData] = useState(INITIAL_DATA);
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isPrinting, setIsPrinting] = useState(false);

            const handleInputChange = (section, field, value) => {
                setData(prev => ({
                    ...prev,
                    [section]: { ...prev[section], [field]: value }
                }));
            };

            const handlePrint = () => {
                if (typeof window.html2pdf === 'undefined') return;

                setIsPrinting(true);
                const element = document.querySelector('.report-container');

                const opt = {
                    margin: 0,
                    filename: `${data.profile.name}_MPS_Passport_Cover.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                window.html2pdf().set(opt).from(element).save().then(() => {
                    setIsPrinting(false);
                }).catch(err => {
                    console.error(err);
                    setIsPrinting(false);
                });
            };

            return (
                <div className="min-h-screen bg-slate-200 py-8">
                    {/* Control Bar */}
                    <div className="max-w-4xl mx-auto mb-8 no-print bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black text-kfa-blue flex items-center gap-2"><Settings className="text-kfa-red"/> MPS Passport 표지 생성기</h1>
                                <p className="text-sm text-slate-500 mt-1">선수 정보를 입력하고 완성된 리포트 표지를 PDF로 저장하세요.</p>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setIsFormOpen(!isFormOpen)} className="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors flex items-center gap-2">
                                    {isFormOpen ? <ChevronUp size={18}/> : <ChevronDown size={18}/>} 정보 수정
                                </button>
                                <button 
                                    onClick={handlePrint} 
                                    disabled={isPrinting}
                                    className="px-6 py-2.5 bg-kfa-blue text-white font-bold rounded-xl hover:opacity-90 transition-opacity flex items-center gap-2 shadow-md disabled:opacity-50">
                                    <Printer size={18}/> {isPrinting ? '생성 중...' : 'PDF 다운로드'}
                                </button>
                            </div>
                        </div>

                        {isFormOpen && (
                            <div className="mt-6 p-5 bg-slate-50 rounded-xl border border-slate-200">
                                <div className="grid grid-cols-3 gap-4">
                                    <div><label className="text-[11px] text-slate-500 block mb-1 font-bold uppercase">선수 이름</label><input type="text" className="w-full p-2 rounded border focus:border-kfa-blue outline-none text-sm" value={data.profile.name} onChange={e => handleInputChange('profile', 'name', e.target.value)} /></div>
                                    <div><label className="text-[11px] text-slate-500 block mb-1 font-bold uppercase">소속팀</label><input type="text" className="w-full p-2 rounded border focus:border-kfa-blue outline-none text-sm" value={data.profile.team} onChange={e => handleInputChange('profile', 'team', e.target.value)} /></div>
                                    <div><label className="text-[11px] text-kfa-red block mb-1 font-bold uppercase">담당 의료진</label><input type="text" className="w-full p-2 rounded border-2 border-kfa-red/30 focus:border-kfa-red outline-none text-sm font-bold" value={data.profile.doctorName} onChange={e => handleInputChange('profile', 'doctorName', e.target.value)} /></div>
                                    <div><label className="text-[11px] text-slate-500 block mb-1 font-bold uppercase">생년월일</label><input type="date" className="w-full p-2 rounded border focus:border-kfa-blue outline-none text-sm" value={data.profile.birth} onChange={e => handleInputChange('profile', 'birth', e.target.value)} /></div>
                                    <div><label className="text-[11px] text-slate-500 block mb-1 font-bold uppercase">검사일자</label><input type="date" className="w-full p-2 rounded border focus:border-kfa-blue outline-none text-sm" value={data.profile.testDate} onChange={e => handleInputChange('profile', 'testDate', e.target.value)} /></div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Report Container */}
                    <div className="report-container flex flex-col items-center">
                        <PageCover data={data} />
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
